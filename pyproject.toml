[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceforge"
version = "0.3.1"
description = "Search and evaluate documents with tenant and role filtering"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2.6,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dense = ["numpy>=1.26,<3", "torch>=2.8,<3", "transformers>=4.38.2,<5", "safetensors>=0.4,<1"]
data = ["pyarrow>=16,<26"]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
evidenceforge = "evidenceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
